name: Offline PWA regression tests

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'offline-pwa.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/offline-pwa.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'offline-pwa.js'
      - 'sw.js'
      - 'manifest.webmanifest'
      - 'tests/**'
      - '.github/workflows/offline-pwa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Precache and airplane-mode checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/offline-sw.test.mjs
