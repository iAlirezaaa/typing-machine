name: Vendor verified Persian print typeface

on:
  push:
    branches: [feat/persian-letterpress-ink-v131]
    paths:
      - 'scripts/vendor-persian-font.py'
      - '.github/workflows/vendor-persian-font.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  font:
    name: Validate OFL license, build WOFF2 and sync release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deterministic font renderer
        run: python -m pip install --disable-pip-version-check 'fonttools[woff]==4.60.1' brotli==1.1.0
      - name: Download and verify Parastoo and OFL-1.1 text
        run: python scripts/vendor-persian-font.py
      - name: Build complete offline web and Windows distribution
        run: node scripts/build.mjs
      - name: Validate Persian font and static release
        run: |
          node --test tests/persian-ink.test.mjs tests/offline-sw.test.mjs tests/mobile-regression.test.mjs tests/media-regression.test.mjs
          node scripts/build.mjs --check
      - name: Save validated font and release files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A fonts/ dist/
          if git diff --cached --quiet; then
            echo "Font and release are already current"
            exit 0
          fi
          git commit -m "assets: vendor verified Parastoo OFL font and final Digital Ink 1.3.1 bundle"
          git push origin HEAD:feat/persian-letterpress-ink-v131
